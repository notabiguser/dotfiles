[font]
size = 11.0

[font.normal]
family = "Hack Nerd Font"
style = "Regular"

[font.bold]
family = "Hack Nerd Font"
style = "Bold"

[font.italic]
family = "Hack Nerd Font"
style = "Italic"

[colors.primary]
background = "#000000"
foreground = "#f6f6f6"

#[window]
#opacity = 0.71

[cursor]
style = "Beam"

#[window.padding]
#x = 8
#y = 0
