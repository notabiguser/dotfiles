[theme.overrides]
separator = "♰"
idle_fg = "#9b2940"
info_fg = "#9b2940"

[[block]]
block = "net"
interval = 5
format = " $ip $speed_up UP $speed_down DOWN "
inactive_format = " $icon: down "

[[block]]
block = "cpu"
interval = 1
format = " $icon $utilization "

[[block]]
block = "memory"
format = " $icon $mem_used_percents "

[[block]]
block = "temperature"
format = " $icon $average avg, $max max "

[[block]]
block = "backlight"

[[block]]
block = "sound"
click = [
  { button = "left", cmd = "pavucontrol" }
]

[[block]]
block = "battery"
format = " $percentage {$time_remaining.dur(hms:true, min_unit:m) |}"
device = "DisplayDevice"
driver = "upower"

[[block]]
block = "keyboard_layout"
driver = "sway"

[[block]]
block = "time"
interval = 60
format = " $timestamp.datetime(f:'%b %m-%d %a %H:%M %p')"
