[theme.overrides]
separator = "♰"
idle_fg = "#9b2940"
info_fg = "#9b2940"

[[block]]
block = "custom"
command = "echo 'потихоньку'"
interval = "once"

[[block]]
block = "music"
format = " $icon $prev$prev $play$play $next$next "

[[block]]
block = "net"
interval = 5
format = " $ip "
inactive_format = " $icon: down "

[[block]]
block = "cpu"
interval = 1
format = " $icon $utilization.eng(w:3) "

[[block]]
block = "memory"
format = " $icon $mem_used_percents.eng(w:3) "

[[block]]
block = "temperature"
format = " $icon $average avg, $max max "

[[block]]
block = "backlight"

[[block]]
block = "sound"

[[block]]
block = "battery"
format = " $icon $percentage {$time_remaining.dur(hms:true, min_unit:m) |}"
full_format = " $icon full "
not_charging_format = " $icon $percentage "
device = "BAT0"
driver = "sysfs"

[[block]]
block = "keyboard_layout"
driver = "sway"

[[block]]
block = "time"
interval = 60
format = " $timestamp.datetime(f:'%b %d-%a %I:%M %p')"
